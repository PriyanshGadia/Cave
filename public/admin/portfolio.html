<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VAULT-01 · Portfolio & Resume Fabricator Manager</title>
<style>
  :root {
    --bg: #060b10;
    --card: #0c141c;
    --border: #1e3a4b;
    --cyan: #39d6ff;
    --amber: #ffb15c;
    --green: #4dff8a;
    --text: #cde4ec;
    --muted: #628292;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, Menlo, Consolas, monospace;
    padding: 24px;
    max-width: 1100px;
    margin: 0 auto;
    line-height: 1.5;
  }
  header {
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  h1 { font-size: 18px; color: var(--cyan); letter-spacing: 0.1em; }
  .badge-count { font-size: 12px; color: var(--muted); }
  .layout { display: grid; grid-template-columns: 380px 1fr; gap: 24px; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px;
  }
  h2 { font-size: 14px; color: var(--amber); margin-bottom: 16px; letter-spacing: 0.08em; }
  label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; margin-top: 12px; }
  input, select, textarea {
    width: 100%;
    background: #04080c;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: #fff;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 12px;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--cyan);
    box-shadow: 0 0 8px rgba(57, 214, 255, 0.25);
  }
  textarea { height: 72px; resize: vertical; }
  .hint { font-size: 10px; color: #8ba5b3; margin-top: 3px; }
  .btn {
    background: rgba(57, 214, 255, 0.12);
    border: 1px solid var(--cyan);
    color: var(--cyan);
    padding: 8px 14px;
    font-family: inherit;
    font-size: 12px;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 16px;
    width: 100%;
    transition: all 0.15s;
  }
  .btn:hover { background: var(--cyan); color: #020b12; }
  .btn-sm {
    padding: 4px 8px;
    font-size: 11px;
    width: auto;
    margin: 0 4px 0 0;
  }
  .btn-verify { border-color: var(--green); color: var(--green); background: rgba(77, 255, 138, 0.1); }
  .btn-verify:hover { background: var(--green); color: #020b12; }
  .btn-danger { border-color: #f87171; color: #f87171; background: rgba(248, 113, 113, 0.1); }
  .btn-danger:hover { background: #f87171; color: #020b12; }

  .item-card {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 14px;
    margin-bottom: 12px;
    background: #081017;
  }
  .item-hdr { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .item-title { font-size: 13px; font-weight: bold; color: #fff; }
  .item-kind { font-size: 10px; padding: 2px 6px; border-radius: 3px; background: rgba(57, 214, 255, 0.15); color: var(--cyan); }
  .item-summary { font-size: 11px; color: #9ab4c2; margin-bottom: 8px; }
  .item-proof { font-size: 11px; color: var(--amber); word-break: break-all; margin-bottom: 10px; }
  .item-proof a { color: var(--cyan); text-decoration: none; }
  .item-proof a:hover { text-decoration: underline; }
  .item-actions { display: flex; gap: 6px; align-items: center; }
  .status-tag { font-size: 10px; padding: 2px 6px; border-radius: 3px; }
  .status-verified { background: rgba(77, 255, 138, 0.15); color: var(--green); }
  .status-pending { background: rgba(255, 177, 92, 0.15); color: var(--amber); }
</style>
</head>
<body>

<header>
  <div>
    <h1>VAULT-01 · RESUME FABRICATOR DATABASE</h1>
    <div class="badge-count">Sector RS2 · Strict Proof Verification Ledger</div>
  </div>
  <div>
    <a href="/" style="color: var(--cyan); font-size: 12px; text-decoration: none;">← BACK TO VAULT</a>
  </div>
</header>

<div class="layout">
  <div class="panel">
    <h2>ADD NEW PORTFOLIO ITEM</h2>
    <form id="addItemForm">
      <label>CATEGORY / KIND</label>
      <select name="kind" required>
        <option value="project">Project</option>
        <option value="skill">Skill</option>
        <option value="certification">Certification</option>
        <option value="education">Education</option>
        <option value="achievement">Achievement</option>
        <option value="experience">Experience</option>
        <option value="marksheet">Marksheet</option>
      </select>

      <label>TITLE</label>
      <input name="title" required placeholder="e.g. Argus — Quant RegTech OS">

      <label>SUMMARY (Factual, Concise)</label>
      <textarea name="summary" required placeholder="Bullet description shown on tailored resume"></textarea>

      <label>PROOF URL (HARD REQUIREMENT)</label>
      <input name="proof_url" type="url" required placeholder="https://github.com/... or credential badge URL">
      <div class="hint">Every single claim must resolve to a valid proof link. No false fabrications allowed.</div>

      <label>PROOF TYPE</label>
      <select name="proof_type" required>
        <option value="repo">GitHub Repository</option>
        <option value="credential">Credential Badge / Certificate</option>
        <option value="transcript">Official Transcript / Marksheet</option>
        <option value="document">Document / Paper</option>
        <option value="link">Live URL / Link</option>
      </select>

      <label>ISSUER / INSTITUTION</label>
      <input name="issuer" placeholder="e.g. IIT Guwahati, Oracle, MIT">

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <div>
          <label>FROM</label>
          <input name="date_from" placeholder="2023">
        </div>
        <div>
          <label>TO</label>
          <input name="date_to" placeholder="2027">
        </div>
      </div>

      <label>TAGS (Comma-separated)</label>
      <input name="tags" placeholder="Python, PyTorch, Quant, MLOps">

      <label>PRIORITY WEIGHT (Higher = Top)</label>
      <input name="weight" type="number" value="80">

      <button type="submit" class="btn">SAVE DRAFT</button>
    </form>
  </div>

  <div class="panel">
    <h2>PORTFOLIO ENTRIES & VERIFICATION QUEUE</h2>
    <div id="itemsList">Loading items...</div>
  </div>
</div>

<script>
async function loadItems() {
  const container = document.getElementById('itemsList');
  try {
    const res = await fetch('/api/admin/portfolio');
    if (!res.ok) throw new Error('API request failed');
    const items = await res.json();
    if (!items.length) {
      container.innerHTML = '<div style="color:var(--muted); font-size:12px;">No items in database. Add one on the left.</div>';
      return;
    }
    container.innerHTML = items.map(item => `
      <div class="item-card">
        <div class="item-hdr">
          <span class="item-title">${escapeHtml(item.title)}</span>
          <div>
            <span class="item-kind">${item.kind.toUpperCase()}</span>
            <span class="status-tag ${item.verified_at ? 'status-verified' : 'status-pending'}">
              ${item.verified_at ? '✓ VERIFIED' : 'PENDING REVIEW'}
            </span>
          </div>
        </div>
        <div class="item-summary">${escapeHtml(item.summary)}</div>
        <div class="item-proof">
          PROOF: <a href="${item.proof_url}" target="_blank" rel="noopener">${item.proof_url} ↗</a>
        </div>
        <div class="item-actions">
          ${!item.verified_at || !item.visible ? `
            <button class="btn btn-sm btn-verify" onclick="verifyItem('${item.id}', true)">✓ VERIFY & PUBLISH</button>
          ` : `
            <button class="btn btn-sm" onclick="verifyItem('${item.id}', false)">UNPUBLISH</button>
          `}
          <button class="btn btn-sm btn-danger" onclick="deleteItem('${item.id}')">DELETE</button>
          <span style="font-size:10px; color:var(--muted); margin-left:auto;">Weight: ${item.weight}</span>
        </div>
      </div>
    `).join('');
  } catch (err) {
    container.innerHTML = '<div style="color:var(--amber); font-size:12px;">Operating in local / offline mode. Showing default verified items.</div>';
  }
}

async function verifyItem(id, publish) {
  await fetch('/api/admin/portfolio', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, visible: publish ? 1 : 0, verified: publish ? 1 : 0 })
  });
  loadItems();
}

async function deleteItem(id) {
  if (!confirm('Permanently delete this entry?')) return;
  await fetch('/api/admin/portfolio', {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  loadItems();
}

document.getElementById('addItemForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const formData = new FormData(e.target);
  const body = Object.fromEntries(formData);
  body.tags = (body.tags || '').split(',').map(s => s.trim()).filter(Boolean);
  body.weight = parseInt(body.weight, 10) || 0;

  const res = await fetch('/api/admin/portfolio', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (res.ok) {
    e.target.reset();
    loadItems();
  } else {
    const err = await res.json();
    alert('Error: ' + (err.error || 'Failed to save'));
  }
});

function escapeHtml(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

loadItems();
</script>
</body>
</html>
