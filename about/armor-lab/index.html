<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Armor Lab Diagnostics</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #222;
      color: #eee;
      font-family: monospace;
      display: flex;
    }
    #viewport {
      flex: 1;
      height: 100vh;
      position: relative;
    }
    canvas { display: block; }
    
    #ui-panel {
      width: 400px;
      height: 100vh;
      background: #111;
      border-left: 1px solid #333;
      padding: 1rem;
      box-sizing: border-box;
      overflow-y: auto;
    }

    h1, h2 {
      margin: 0 0 1rem 0;
      font-size: 1.2rem;
      border-bottom: 1px solid #444;
      padding-bottom: 0.5rem;
    }

    .control-group {
      margin-bottom: 1.5rem;
    }

    select, button {
      width: 100%;
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 0.5rem;
      margin-bottom: 0.5rem;
      cursor: pointer;
      font-family: inherit;
    }
    
    button:hover { background: #444; }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    #stats-container {
      font-size: 0.85rem;
      line-height: 1.4;
      background: #000;
      padding: 0.5rem;
      border: 1px solid #333;
      margin-bottom: 1rem;
    }

    #hierarchy-tree {
      font-size: 0.8rem;
      background: #000;
      padding: 0.5rem;
      border: 1px solid #333;
      max-height: 300px;
      overflow-y: auto;
    }

    .tree-node {
      padding-left: 1rem;
      cursor: pointer;
    }
    .tree-node:hover {
      background: #333;
    }
    .tree-node.selected {
      background: #0055aa;
    }

    #loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      z-index: 100;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="loading-overlay" class="hidden">LOADING...</div>
  </div>

  <div id="ui-panel">
    <h1>Armor Lab</h1>

    <div class="control-group">
      <h2>Select Donor</h2>
      <select id="donor-select">
        <option value="/assets/armor/donors/mark7/iron-man_mark_7.glb">Mark 7</option>
        <option value="/assets/armor/donors/warmachine/war_machine_-_cacw.glb">War Machine</option>
        <option value="/assets/armor/donors/mark85/iron-man_mark_85__rigged.glb">Mark 85</option>
        <option value="/assets/armor/donors/ironman/iron_man.glb">Iron Man</option>
        <option value="/assets/armor/donors/ironman-rig/iron_man_rig.glb">Iron Man Rig</option>
        <option value="/assets/armor/donors/ironman-norig/iron-man-with_no_rig.glb">Iron Man No-Rig</option>
      </select>
    </div>

    <div class="control-group">
      <h2>Diagnostic Camera</h2>
      <div class="btn-grid">
        <button id="cam-front">FRONT</button>
        <button id="cam-back">BACK</button>
        <button id="cam-left">LEFT</button>
        <button id="cam-right">RIGHT</button>
        <button id="cam-34-front">3/4 FRONT</button>
        <button id="cam-34-rear">3/4 REAR</button>
        <button id="cam-top">TOP</button>
        <button id="cam-bottom">BOTTOM</button>
      </div>
      <button id="cam-fit" style="margin-top: 0.5rem;">FRAME MODEL</button>
    </div>

    <div class="control-group">
      <h2>Materials & View</h2>
      <div class="btn-grid">
        <button id="mat-original">ORIGINAL</button>
        <button id="mat-vault">VAULT TEST</button>
        <button id="mat-wireframe">WIREFRAME</button>
      </div>
    </div>

    <div class="control-group">
      <h2>Statistics</h2>
      <div id="stats-container">
        Loading...
      </div>
    </div>

    <div class="control-group">
      <h2>Hierarchy</h2>
      <div id="hierarchy-tree"></div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
